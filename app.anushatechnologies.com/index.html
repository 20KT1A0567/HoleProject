<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anusha Bazaar</title>

  <!-- WhatsApp / social share preview -->
  <meta property="og:title" content="Anusha Bazaar">
  <meta property="og:description" content="Get up to ₹50 in your wallet when you sign up.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://app.anushatechnologies.com/">

  <!--
   Fallback redirect ONLY — under normal conditions .htaccess does a 302
   server-side redirect before this HTML is ever served. This file exists
   so that if .htaccess gets disabled by hosting, users still land on the
   Play Store instead of a 404.
  -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.anusha.deliveryapp">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8b500;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    a {
      color: #1a1a1a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <script>
    /* Build Play Store URL with referrer code if present in /r/{CODE}. */
    (function () {
      const PACKAGE = "com.anusha.deliveryapp";
      const base = "https://play.google.com/store/apps/details?id=" + PACKAGE;
      const path = window.location.pathname.split("/").filter(Boolean);
      let url = base;
      if (path[0] === "r" && path[1]) {
        url = base + "&referrer=" + encodeURIComponent("referralCode=" + path[1].toUpperCase());
      }
      window.location.replace(url);
    })();
  </script>

  <p>Redirecting to Google Play… <br>
    <a href="https://play.google.com/store/apps/details?id=com.anusha.deliveryapp">Tap here if not redirected.</a>
  </p>
</body>
</html>
