name: Delivery App — EAS Build (APK/AAB)

on:
  push:
    branches: [master]
    paths:
      - 'Anushadeliverypartnerapp/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview     # APK — direct install
          - production  # AAB — Play Store

jobs:
  eas-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Anushadeliverypartnerapp/package-lock.json

      - name: Install dependencies
        working-directory: Anushadeliverypartnerapp
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create google-services.json from secret
        working-directory: Anushadeliverypartnerapp
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: Create .env
        working-directory: Anushadeliverypartnerapp
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> .env

      - name: EAS Build
        working-directory: Anushadeliverypartnerapp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_PROFILE="${{ github.event.inputs.build_type || 'preview' }}"
          eas build --platform android --profile $BUILD_PROFILE --non-interactive
