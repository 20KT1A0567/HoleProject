spring.application.name=vr-technologies-ecommerce
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/vr_technologies_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2395
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=VRTechnologiesSecretKey2024SuperSecureJWTSecretKeyForHMACSHA256Algorithm
app.jwt.expiration=86400000

# Bootstrap super admin (created on first start if missing)
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@vr.com}
app.bootstrap.admin-password=${ADMIN_PASSWORD:admin123}
app.bootstrap.admin-name=${ADMIN_NAME:Super Admin}

# File upload (raised to allow video uploads)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# ── AWS S3 ───────────────────────────────────────────────────────────────────
# REPLACE the fallback values (after the colon) with your real keys,
# OR leave them and set the matching env vars on the server.
aws.access-key-id=${AWS_ACCESS_KEY_ID:YOUR_AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:YOUR_AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-south-2}
aws.s3.bucket-name=${AWS_S3_BUCKET:vrtech18}
# Per-file size guards (bytes) on top of the multipart limit
app.upload.max-image-bytes=10485760
app.upload.max-video-bytes=104857600
logging.level.com.amazonaws=WARN
